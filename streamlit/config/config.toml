[global]
developmentMode = false
gatherUsageStats = false
showDeployButton = false

[server]
port = 8501
address = "0.0.0.0"
enableCORS = false
enableWebsocketCompression = false
maxUploadSize = 200
maxMessageSize = 200

[browser]
gatherUsageStats = false

[theme]
primaryColor = "#667eea"
backgroundColor = "#ffffff"
secondaryBackgroundColor = "#f0f2f6"
textColor = "#262730"
font = "sans serif"

[logger]
level = "info"

[client]
toolbarMode = "auto"
showSidebarNavigation = true
