[tool:pytest]
# Конфигурация pytest для Event Planner API

# Директории для поиска тестов
testpaths = tests

# Паттерны для поиска тестовых файлов
python_files = test_*.py

# Паттерны для поиска тестовых классов
python_classes = Test*

# Паттерны для поиска тестовых функций
python_functions = test_*

# Минимальная версия pytest
minversion = 6.0

# Дополнительные опции по умолчанию
addopts =
    --strict-markers
    --strict-config
    --verbose
    --tb=short
    --maxfail=10
    --durations=10

# Маркеры для категоризации тестов
markers =
    unit: Unit tests for individual components
    integration: Integration tests for component interaction
    service: Tests for service layer
    model: Tests for data models
    slow: Tests that take longer to run
    database: Tests that require database
    api: API endpoint tests
    auth: Authentication/authorization tests
    balance: Balance operation tests
    events: Event management tests
    transactions: Transaction tests
    edge_case: Edge case and boundary tests
    regression: Regression tests

# Фильтры для предупреждений
filterwarnings =
    ignore::UserWarning
    ignore::DeprecationWarning
    ignore::PendingDeprecationWarning

# Опции покрытия кода (если используется pytest-cov)
[tool:coverage:run]
source = app
omit =
    app/tests/*
    app/scripts/*
    app/ml_service/*
    */venv/*
    */env/*

[tool:coverage:report]
exclude_lines =
    pragma: no cover
    def __repr__
    raise AssertionError
    raise NotImplementedError
    if __name__ == .__main__.:
    class .*\(Protocol\):
    @(abc\.)?abstractmethod

[tool:coverage:html]
directory = htmlcov
